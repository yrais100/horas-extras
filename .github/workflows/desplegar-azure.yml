# Despliega en Azure App Service. Requiere en el repositorio:
#   - variable  AZURE_WEBAPP_NAME             (nombre del App Service)
#   - secreto   AZURE_WEBAPP_PUBLISH_PROFILE  (perfil de publicación descargado desde Azure)
name: Desplegar en Azure

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  desplegar:
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      - run: dotnet publish src/HorasExtras.Web -c Release -o publicar
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publicar
